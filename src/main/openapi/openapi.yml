openapi: 3.0.3
info:
  title: ms-rate-service API - Banco ABC
  description: Microservicio para consulta de tipos de cambio con límite de consultas diarias
  version: 1.0-SNAPSHOT
  contact:
    name: Banco ABC
    email: tech@bancoabc.com

servers:
  - url: http://localhost:8080
paths:
  /api/v1/exchange-rate:
    get:
      tags:
        - Exchange Rate
      operationId: getExchangeRate
      summary: Consultar tipo de cambio
      description: Obtiene el tipo de cambio entre dos monedas para un cliente específico
      parameters:
        - name: dni
          in: query
          required: true
          description: DNI del cliente
          schema:
            type: string
            pattern: '^[0-9]$'
            minLength: 8
            maxLength: 8
          example: "12345678"
        - name: fecha
          in: query
          required: false
          description: fecha de la consulta en formato ISO 8601 (YYYY-MM-DD)
          schema:
            type: string
            pattern: '"^\\d{4}([-\\/])\\d{2}\\1\\d{2}$'
          example: "2025-08-19"
      responses:
        '200':
          description: Consulta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponse'
        '400':
          description: Parámetros de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de consultas diarias excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/exchange-rate/queries/count/{dni}:
    get:
      tags:
        - Exchange Rate
      operationId: getQueryCount
      summary: Consultar número de queries realizadas
      description: Obtiene el número de consultas realizadas hoy por un cliente específico
      parameters:
        - name: dni
          in: path
          required: true
          description: DNI del cliente
          schema:
            type: string
            pattern: '^[0-9]$'
            minLength: 8
            maxLength: 8
          example: "12345678"
      responses:
        '200':
          description: Consulta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryCountResponse'
        '400':
          description: DNI inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ExchangeRateResponse:
      type: object
      required:
        - dni
        - venta
        - sunat
        - compra
        - timestamp
        - remainingQueries
      properties:
        dni:
          type: string
          description: DNI del cliente que realizó la consulta
          example: "12345678"
        fromCurrency:
          type: double
          description: Tipo de cambio venta
          example: 3.555
        toCurrency:
          type: double
          description: Tipo de cambio sunat
          example: 3.555
        exchangeRate:
          type: number
          format: double
          description: Tipo de cambio compra
          minimum: 0
          example: 3.555
        date:
          type: string
          description: fecha con que se realiza la consulta en formato ISO 8601 (YYYY-MM-DD)
          format: date
          example: "2025-08-16"
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora de la consulta
          example: "2025-08-16T15:30:45.123Z"
        remainingQueries:
          type: integer
          description: Número de consultas restantes para hoy
          minimum: 0
          maximum: 10
          example: 9

    QueryCountResponse:
      type: object
      required:
        - dni
        - todayQueries
        - remainingQueries
        - maxDailyQueries
      properties:
        dni:
          type: string
          description: DNI del cliente
          example: "12345678"
        todayQueries:
          type: integer
          description: Número de consultas realizadas hoy
          minimum: 0
          example: 1
        remainingQueries:
          type: integer
          description: Consultas restantes para hoy
          minimum: 0
          maximum: 10
          example: 9
        maxDailyQueries:
          type: integer
          description: Máximo número de consultas permitidas por día
          example: 10

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
        - statusCode
      properties:
        error:
          type: string
          description: Código de error
        message:
          type: string
          description: Mensaje descriptivo del error
          example: "Límite de consultas diarias excedido. Máximo permitido: 10"
